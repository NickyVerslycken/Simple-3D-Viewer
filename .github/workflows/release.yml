name: Release

# Builds the installers for all platforms and attaches them (with SHA-256 checksum files) to a release.
# Run it from the Actions tab: "Release" -> "Run workflow", enter the tag (e.g. v1.0.1) and pick the platform.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to (created if it does not exist)
        required: true
        default: v1.0.0
      platform:
        description: Which installers to build. Files of the same name on the release are replaced, so pick one platform to leave the others untouched.
        type: choice
        options: [all, windows, macos, linux]
        default: all

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          all='[{"platform":"windows","os":"windows-latest","script":"dist:win"},{"platform":"macos","os":"macos-latest","script":"dist:mac"},{"platform":"linux","os":"ubuntu-latest","script":"dist:linux"}]'
          echo "matrix=$(echo "$all" | jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .platform == $p))')" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds; add signing secrets to sign / notarize
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/Simple-3D-Viewer-*.exe
            release/Simple-3D-Viewer-*.msi
            release/Simple-3D-Viewer-*.dmg
            release/Simple-3D-Viewer-*.AppImage
            release/Simple-3D-Viewer-*.deb
            release/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create the release if needed and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "See [CHANGELOG.md](https://github.com/$GH_REPO/blob/main/CHANGELOG.md)."
          gh release upload "$TAG" assets/* --clobber
